<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var theme =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <title>Periodic table | Danila Shiryaev</title>
  <meta name="description" content="An interactive periodic table of 100+ elemental properties: bubbles, scatter plots, a PCA map of the elements and short stories from my research." />

  <link rel="icon" href="images/icons/favicon.ico" type="image/x-icon" />
  <link rel="alternate icon" href="images/icons/favicon.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="preload" href="data/elements.json" as="fetch" crossorigin />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/periodic-table.css" />
</head>

<body>
  <div class="layout layout--wide">
    <main class="main">
      <section id="periodic-table" class="section">
        <h2>periodic table</h2>
        <p class="pt-intro">
          A periodic table built from the elemental property list behind my
          machine-learning features. Pick a property, resize the table by it,
          plot any two properties against each other, or see where the
          elements land in a PCA map.
        </p>
        <div id="ptable" class="ptable">
          <p class="pt-loading">Loading the elements…</p>
        </div>
        <noscript>
          <p>The interactive periodic table needs JavaScript.</p>
        </noscript>
      </section>
    </main>
  </div>

  <script src="data/papers.js"></script>
  <script src="data/research.js"></script>
  <script src="js/site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="js/ptable/main.js"></script>
</body>
</html>
